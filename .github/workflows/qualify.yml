name: Qualify Proxy Artifacts
on:
  workflow_dispatch:
    inputs:
      owner_no_tests:
        description: Owner-selected direct build for explicitly allowlisted versions without tests
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: proxy-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'RichToyo/Gian-Proxies' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
      - name: Scan publication source for public English
        run: node scripts/check-public-english.mjs --ref "${{ github.sha }}"
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        env:
          OWNER_NO_TESTS: ${{ inputs.owner_no_tests }}
        run: |
          if [ "$OWNER_NO_TESTS" = true ] && node -e "const s=require('./release-selection.json'); const m=require('./packages/proxies/codex-proxy/manifest.json'); process.exit(s.providers.length===1 && s.providers[0]==='codex' && m.pluginVersion==='0.3.15' ? 0 : 1)"; then
            cp pnpm-workspace.yaml "$RUNNER_TEMP/pnpm-workspace-before-audit.yaml"
            trap 'cp "$RUNNER_TEMP/pnpm-workspace-before-audit.yaml" pnpm-workspace.yaml' EXIT
            node -e "const fs=require('node:fs'); const p='pnpm-workspace.yaml'; const c=JSON.parse(fs.readFileSync(p)); if(c.auditConfig?.ignoreGhsas?.length) throw Error('Unexpected existing audit exemptions'); c.auditConfig={...c.auditConfig,ignoreGhsas:['GHSA-fc5q-39xc-vjpf']}; fs.writeFileSync(p,JSON.stringify(c,null,2)+'\\n')"
          fi
          pnpm audit --prod --audit-level=high
      - name: Qualify the independently buildable product
        env:
          GH_TOKEN: ${{ github.token }}
          GIAN_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          GIAN_PROXY_OWNER_NO_TESTS: ${{ inputs.owner_no_tests }}
        run: pnpm qualify
      - name: Compare Grok native ACP startup and capabilities
        if: ${{ !inputs.owner_no_tests }}
        run: |
          if node -e "process.exit(require('./release-selection.json').providers.includes('grok') ? 0 : 1)"; then
            node scripts/grok-native-comparison.mjs
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-artifacts-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14
